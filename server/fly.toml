# fly.toml app configuration file generated for aztec-chess-relay on 2026-02-12T17:03:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aztec-chess-relay'
primary_region = 'iad'

[build]

[env]
  PORT = '8081'

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
